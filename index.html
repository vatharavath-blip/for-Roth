<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎂</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Pacifico&family=Noto+Sans+Khmer:wght@300;400;700&family=Dancing+Script:wght@700&display=swap');

  :root {
    --pink: #ff6b9d;
    --pink-light: #ffb3cc;
    --pink-pale: #fff0f6;
    --purple: #c084fc;
    --purple-deep: #7c3aed;
    --gold: #fbbf24;
    --cream: #fff8f0;
    --text-dark: #3b0764;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: linear-gradient(135deg, #ffe4f3 0%, #fff0fb 40%, #ede9fe 100%);
    min-height: 100vh;
    overflow-x: hidden;
    font-family: 'Noto Sans Khmer', sans-serif;
    position: relative;
  }

  .sparkle {
    position: fixed;
    pointer-events: none;
    animation: twinkle 2s infinite;
    font-size: 14px;
    z-index: 0;
  }
  @keyframes twinkle {
    0%,100% { opacity: 0; transform: scale(0.5); }
    50% { opacity: 1; transform: scale(1.2); }
  }

  .heart-float {
    position: fixed;
    pointer-events: none;
    font-size: 22px;
    animation: floatUp 6s linear infinite;
    z-index: 0;
    opacity: 0;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translateY(100vh) rotate(0deg); }
    10% { opacity: 0.8; }
    90% { opacity: 0.5; }
    100% { opacity: 0; transform: translateY(-10vh) rotate(360deg); }
  }

  .balloon-row {
    display: flex;
    justify-content: center;
    gap: 18px;
    padding-top: 24px;
    position: relative;
    z-index: 2;
  }
  .balloon {
    width: 52px;
    display: flex;
    flex-direction: column;
    align-items: center;
    animation: sway 3s ease-in-out infinite;
  }
  .balloon:nth-child(2) { animation-delay: 0.5s; }
  .balloon:nth-child(3) { animation-delay: 1s; }
  .balloon:nth-child(4) { animation-delay: 1.5s; }
  .balloon:nth-child(5) { animation-delay: 0.3s; }
  @keyframes sway {
    0%,100% { transform: rotate(-5deg) translateY(0); }
    50% { transform: rotate(5deg) translateY(-8px); }
  }
  .balloon svg { width: 52px; height: 68px; }
  .balloon-string { width: 1px; height: 45px; background: #aaa; }

  .card {
    max-width: 560px;
    margin: 10px auto 30px;
    background: rgba(255,255,255,0.75);
    backdrop-filter: blur(18px);
    border-radius: 36px;
    padding: 30px 32px 36px;
    box-shadow: 0 8px 40px rgba(192,100,180,0.18), 0 0 0 1.5px rgba(255,255,255,0.9) inset;
    position: relative;
    z-index: 2;
    animation: cardIn 1s cubic-bezier(.22,.61,.36,1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(60px) scale(0.92); }
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .title {
    text-align: center;
    font-family: 'Pacifico', cursive;
    font-size: 2.4rem;
    background: linear-gradient(135deg, #ff6b9d, #c084fc, #fbbf24);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 4px;
    animation: pulse 2.5s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { letter-spacing: 1px; }
    50% { letter-spacing: 4px; }
  }

  .name-title {
    text-align: center;
    font-family: 'Dancing Script', cursive;
    font-size: 2rem;
    color: var(--purple-deep);
    margin-bottom: 6px;
    animation: nameGlow 2s ease-in-out infinite;
  }
  @keyframes nameGlow {
    0%,100% { text-shadow: 0 0 8px rgba(192,132,252,0.4); }
    50% { text-shadow: 0 0 20px rgba(192,132,252,0.9), 0 0 40px rgba(255,107,157,0.4); }
  }

  .date-badge { text-align: center; margin-bottom: 18px; }
  .date-badge span {
    background: linear-gradient(90deg, var(--pink), var(--purple));
    color: white;
    font-size: 0.85rem;
    padding: 4px 18px;
    border-radius: 99px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  .bear-scene {
    display: flex;
    justify-content: center;
    align-items: flex-end;
    gap: 14px;
    margin: 10px 0 18px;
    position: relative;
    min-height: 190px;
  }

  .bear-wrap { animation: bearBounce 1.6s ease-in-out infinite; }
  @keyframes bearBounce {
    0%,100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-12px) rotate(2deg); }
  }

  .cake-wrap { animation: cakeWiggle 2s ease-in-out infinite 0.4s; }
  @keyframes cakeWiggle {
    0%,100% { transform: rotate(0deg); }
    25% { transform: rotate(-3deg); }
    75% { transform: rotate(3deg); }
  }

  .flame {
    animation: flicker 0.4s ease-in-out infinite alternate;
    transform-origin: bottom center;
  }
  @keyframes flicker {
    from { transform: scaleY(1) scaleX(1); opacity: 1; }
    to { transform: scaleY(1.25) scaleX(0.85); opacity: 0.85; }
  }

  .stars-burst {
    position: absolute;
    top: 0; left: 50%;
    transform: translateX(-50%);
    font-size: 22px;
    animation: starsPop 2s ease-out both;
  }
  @keyframes starsPop {
    0% { opacity: 0; transform: translateX(-50%) scale(0); }
    30% { opacity: 1; transform: translateX(-50%) scale(1.3); }
    100% { opacity: 0.6; transform: translateX(-50%) scale(1); }
  }

  .message-box {
    background: linear-gradient(135deg, #fff0f8, #f3e8ff);
    border-radius: 20px;
    padding: 22px 22px 18px;
    border: 1.5px solid rgba(255, 100, 160, 0.2);
    position: relative;
    overflow: hidden;
  }
  .message-box::before {
    content: '🌸';
    position: absolute;
    top: -10px; right: -10px;
    font-size: 60px;
    opacity: 0.08;
  }

  .msg-eng {
    font-family: 'Dancing Script', cursive;
    font-size: 1.55rem;
    color: var(--pink);
    text-align: center;
    margin-bottom: 14px;
    animation: shimmer 3s ease-in-out infinite;
  }
  @keyframes shimmer {
    0%,100% { color: #ff6b9d; }
    50% { color: #c084fc; }
  }

  .msg-khmer {
    font-family: 'Noto Sans Khmer', sans-serif;
    font-size: 1.02rem;
    color: var(--text-dark);
    line-height: 2;
    text-align: center;
    font-weight: 400;
  }

  .signature {
    margin-top: 16px;
    text-align: right;
    font-family: 'Dancing Script', cursive;
    font-size: 1.1rem;
    color: var(--purple-deep);
    font-weight: 700;
  }

  .confetti-piece {
    position: fixed;
    width: 10px;
    height: 10px;
    top: -10px;
    animation: confettiFall linear infinite;
    z-index: 0;
    border-radius: 2px;
  }
  @keyframes confettiFall {
    0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
    100% { transform: translateY(110vh) rotate(720deg); opacity: 0.2; }
  }

  .emoji-row {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 20px;
    font-size: 1.5rem;
    animation: emojiPop 1.5s ease-out 0.8s both;
  }
  @keyframes emojiPop {
    from { opacity: 0; transform: scale(0.3); }
    to { opacity: 1; transform: scale(1); }
  }
  .emoji-row span {
    display: inline-block;
    animation: emojiBob 2s ease-in-out infinite;
  }
  .emoji-row span:nth-child(2) { animation-delay: 0.3s; }
  .emoji-row span:nth-child(3) { animation-delay: 0.6s; }
  .emoji-row span:nth-child(4) { animation-delay: 0.9s; }
  .emoji-row span:nth-child(5) { animation-delay: 1.2s; }
  @keyframes emojiBob {
    0%,100% { transform: translateY(0); }
    50% { transform: translateY(-8px); }
  }

  .music-notes {
    position: fixed;
    top: 10px; right: 14px;
    font-size: 20px;
    z-index: 10;
    animation: musicFloat 3s ease-in-out infinite;
  }
  @keyframes musicFloat {
    0%,100% { transform: translateY(0) rotate(-10deg); }
    50% { transform: translateY(-8px) rotate(10deg); }
  }
</style>
</head>
<body>

<div class="music-notes">🎵🎶</div>

<div class="balloon-row">
  <div class="balloon">
    <svg viewBox="0 0 52 68" fill="none"><ellipse cx="26" cy="28" rx="22" ry="26" fill="#ff6b9d"/><ellipse cx="20" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/><polygon points="26,54 23,60 29,60" fill="#ff6b9d"/></svg>
    <div class="balloon-string"></div>
  </div>
  <div class="balloon">
    <svg viewBox="0 0 52 68" fill="none"><ellipse cx="26" cy="28" rx="22" ry="26" fill="#c084fc"/><ellipse cx="20" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/><polygon points="26,54 23,60 29,60" fill="#c084fc"/></svg>
    <div class="balloon-string"></div>
  </div>
  <div class="balloon">
    <svg viewBox="0 0 52 68" fill="none"><ellipse cx="26" cy="28" rx="22" ry="26" fill="#fbbf24"/><ellipse cx="20" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/><polygon points="26,54 23,60 29,60" fill="#fbbf24"/></svg>
    <div class="balloon-string"></div>
  </div>
  <div class="balloon">
    <svg viewBox="0 0 52 68" fill="none"><ellipse cx="26" cy="28" rx="22" ry="26" fill="#fb7185"/><ellipse cx="20" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/><polygon points="26,54 23,60 29,60" fill="#fb7185"/></svg>
    <div class="balloon-string"></div>
  </div>
  <div class="balloon">
    <svg viewBox="0 0 52 68" fill="none"><ellipse cx="26" cy="28" rx="22" ry="26" fill="#a78bfa"/><ellipse cx="20" cy="18" rx="6" ry="8" fill="rgba(255,255,255,0.3)"/><polygon points="26,54 23,60 29,60" fill="#a78bfa"/></svg>
    <div class="balloon-string"></div>
  </div>
</div>

<div class="card">
  <div class="title">Happy Birthday! 🎂</div>
  <div class="name-title">✨ Roth ✨</div>
  <div class="date-badge"><span>23 · 05 · 2026</span></div>

  <div class="bear-scene">
    <div class="stars-burst">✨⭐✨</div>

    <div class="bear-wrap">
      <svg width="130" height="170" viewBox="0 0 130 170" fill="none">
        <ellipse cx="65" cy="120" rx="42" ry="46" fill="#c8956c"/>
        <ellipse cx="65" cy="128" rx="26" ry="30" fill="#e8bfa0"/>
        <ellipse cx="22" cy="118" rx="14" ry="10" fill="#c8956c" transform="rotate(-30 22 118)"/>
        <ellipse cx="108" cy="100" rx="14" ry="10" fill="#c8956c" transform="rotate(40 108 100)"/>
        <circle cx="116" cy="88" r="10" fill="#c8956c"/>
        <circle cx="13" cy="126" r="10" fill="#c8956c"/>
        <ellipse cx="48" cy="162" rx="14" ry="9" fill="#c8956c"/>
        <ellipse cx="82" cy="162" rx="14" ry="9" fill="#c8956c"/>
        <circle cx="65" cy="65" r="38" fill="#c8956c"/>
        <circle cx="35" cy="34" r="14" fill="#c8956c"/>
        <circle cx="35" cy="34" r="9" fill="#e8937c"/>
        <circle cx="95" cy="34" r="14" fill="#c8956c"/>
        <circle cx="95" cy="34" r="9" fill="#e8937c"/>
        <ellipse cx="65" cy="72" rx="20" ry="16" fill="#e8bfa0"/>
        <circle cx="53" cy="60" r="5" fill="#3b1f0a"/>
        <circle cx="77" cy="60" r="5" fill="#3b1f0a"/>
        <circle cx="55" cy="58" r="2" fill="white"/>
        <circle cx="79" cy="58" r="2" fill="white"/>
        <ellipse cx="65" cy="70" rx="5" ry="3.5" fill="#3b1f0a"/>
        <path d="M57 77 Q65 85 73 77" stroke="#3b1f0a" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <ellipse cx="44" cy="72" rx="7" ry="4" fill="#ff9db0" opacity="0.5"/>
        <ellipse cx="86" cy="72" rx="7" ry="4" fill="#ff9db0" opacity="0.5"/>
        <g transform="translate(50, 30)">
          <path d="M0,8 Q-14,-4 -10,-12 Q-2,-8 0,0 Q2,-8 10,-12 Q14,-4 0,8Z" fill="#ff6b9d"/>
          <circle cx="0" cy="0" r="4" fill="#ff3380"/>
        </g>
        <text x="2" y="50" font-size="14" opacity="0.7">💕</text>
        <text x="108" y="65" font-size="13" opacity="0.7">✨</text>
      </svg>
    </div>

    <div class="cake-wrap">
      <svg width="110" height="130" viewBox="0 0 110 130" fill="none">
        <ellipse cx="55" cy="122" rx="48" ry="8" fill="#e0c0a0" opacity="0.5"/>
        <rect x="12" y="82" width="86" height="38" rx="8" fill="#ff8fb3"/>
        <ellipse cx="55" cy="82" rx="43" ry="10" fill="#ffb3cc"/>
        <rect x="22" y="52" width="66" height="32" rx="8" fill="#c084fc"/>
        <ellipse cx="55" cy="52" rx="33" ry="8" fill="#d8b4fe"/>
        <rect x="34" y="28" width="42" height="26" rx="8" fill="#fbbf24"/>
        <ellipse cx="55" cy="28" rx="21" ry="6" fill="#fde68a"/>
        <circle cx="28" cy="98" r="4" fill="white" opacity="0.6"/>
        <circle cx="44" cy="102" r="3" fill="white" opacity="0.5"/>
        <circle cx="66" cy="98" r="4" fill="white" opacity="0.6"/>
        <circle cx="82" cy="102" r="3" fill="white" opacity="0.5"/>
        <circle cx="36" cy="68" r="3" fill="white" opacity="0.5"/>
        <circle cx="55" cy="64" r="4" fill="white" opacity="0.6"/>
        <circle cx="74" cy="68" r="3" fill="white" opacity="0.5"/>
        <rect x="40" y="12" width="7" height="18" rx="3" fill="#ff6b9d"/>
        <rect x="54" y="8" width="7" height="22" rx="3" fill="#c084fc"/>
        <rect x="68" y="12" width="7" height="18" rx="3" fill="#fbbf24"/>
        <ellipse class="flame" cx="43.5" cy="10" rx="5" ry="7" fill="#fbbf24" opacity="0.9"/>
        <ellipse class="flame" cx="57.5" cy="5" rx="5" ry="8" fill="#fb923c" opacity="0.9"/>
        <ellipse class="flame" cx="71.5" cy="10" rx="5" ry="7" fill="#fbbf24" opacity="0.9"/>
        <ellipse class="flame" cx="43.5" cy="10" rx="3" ry="4" fill="white" opacity="0.5"/>
        <ellipse class="flame" cx="57.5" cy="5" rx="3" ry="5" fill="white" opacity="0.5"/>
        <ellipse class="flame" cx="71.5" cy="10" rx="3" ry="4" fill="white" opacity="0.5"/>
      </svg>
    </div>
  </div>

  <div class="message-box">
    <div class="msg-eng">Happy Birthday, Roth 🌸</div>
    <div class="msg-khmer">
      Happy birthday អាយុកធំបាត់🎀<br>
      សំណាងល្អ ហើយសូមជូនពរឲជាប់ប្រឡង<br>
      និងរៀនពូកែ 📚✨<br><br>
      ត្រូវរៀនគិតពីជិវិតទៅមុខទៀត<br>
      កុំនូវលេងសើច 💪🌟
    </div>
    <div class="signature">— By RaKo 💜<br><small style="font-size:0.78rem; color:#a855f7;">ILY</small></div>
  </div>

  <div class="emoji-row">
    <span>🎂</span><span>🌸</span><span>💕</span><span>🎁</span><span>✨</span>
  </div>
</div>

<script>
  // SPARKLES
  const sparkleEmojis = ['✨','⭐','💫','🌟','⚡'];
  for (let i = 0; i < 18; i++) {
    const s = document.createElement('div');
    s.className = 'sparkle';
    s.textContent = sparkleEmojis[Math.floor(Math.random() * sparkleEmojis.length)];
    s.style.left = Math.random() * 100 + 'vw';
    s.style.top = Math.random() * 100 + 'vh';
    s.style.animationDelay = (Math.random() * 3) + 's';
    s.style.animationDuration = (1.5 + Math.random() * 2) + 's';
    s.style.fontSize = (10 + Math.random() * 16) + 'px';
    document.body.appendChild(s);
  }

  // FLOATING HEARTS
  const heartEmojis = ['💕','💖','💗','💝','🌸','💞'];
  for (let i = 0; i < 12; i++) {
    const h = document.createElement('div');
    h.className = 'heart-float';
    h.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    h.style.left = (Math.random() * 95) + 'vw';
    h.style.animationDelay = (Math.random() * 6) + 's';
    h.style.animationDuration = (5 + Math.random() * 5) + 's';
    h.style.fontSize = (14 + Math.random() * 16) + 'px';
    document.body.appendChild(h);
  }

  // CONFETTI
  const colors = ['#ff6b9d','#c084fc','#fbbf24','#fb7185','#a78bfa','#34d399','#60a5fa'];
  for (let i = 0; i < 30; i++) {
    const c = document.createElement('div');
    c.className = 'confetti-piece';
    c.style.left = Math.random() * 100 + 'vw';
    c.style.background = colors[Math.floor(Math.random() * colors.length)];
    c.style.width = (6 + Math.random() * 8) + 'px';
    c.style.height = (6 + Math.random() * 8) + 'px';
    c.style.animationDuration = (4 + Math.random() * 6) + 's';
    c.style.animationDelay = (Math.random() * 6) + 's';
    c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
    document.body.appendChild(c);
  }

  // LIVE COUNTDOWN
  const birthdayDate = new Date('2026-05-23T00:00:00');
  const card = document.querySelector('.card');
  const countWrapper = document.createElement('div');
  countWrapper.id = 'countdown-wrap';
  countWrapper.innerHTML = `
    <div style="text-align:center; margin-top:18px;">
      <div style="font-family:'Noto Sans Khmer',sans-serif; font-size:0.8rem; color:#9333ea; margin-bottom:8px;">
        ⏳ រង់ចាំថ្ងៃកំណើត Ah jing
      </div>
      <div style="display:flex; justify-content:center; gap:10px; flex-wrap:wrap;">
        ${['days','hours','mins','secs'].map(u => `
          <div style="background:linear-gradient(135deg,#fff0f8,#f3e8ff);border-radius:14px;padding:10px 14px;min-width:58px;box-shadow:0 2px 12px rgba(192,100,180,0.15);border:1px solid rgba(255,107,157,0.2);">
            <div id="cd-${u}" style="font-family:'Pacifico',cursive;font-size:1.6rem;color:#c026d3;line-height:1;">00</div>
            <div style="font-size:0.65rem;color:#9333ea;margin-top:2px;font-family:'Noto Sans Khmer',sans-serif;">${{days:'ថ្ងៃ',hours:'ម៉ោង',mins:'នាទី',secs:'វិនាទី'}[u]}</div>
          </div>
        `).join('')}
      </div>
      <div id="cd-birthday-msg" style="display:none; font-family:'Pacifico',cursive; font-size:1.3rem; color:#ff6b9d; margin-top:10px;">🎉 Happy Birthday Roth! 🎉</div>
    </div>
  `;
  card.appendChild(countWrapper);

  function updateCountdown() {
    const now = new Date();
    const diff = birthdayDate - now;
    if (diff <= 0) {
      document.getElementById('countdown-wrap').querySelector('div > div:first-child').style.display = 'none';
      document.getElementById('countdown-wrap').querySelector('div > div:nth-child(2)').style.display = 'none';
      document.getElementById('cd-birthday-msg').style.display = 'block';
      return;
    }
    const days  = Math.floor(diff / (1000*60*60*24));
    const hours = Math.floor((diff % (1000*60*60*24)) / (1000*60*60));
    const mins  = Math.floor((diff % (1000*60*60)) / (1000*60));
    const secs  = Math.floor((diff % (1000*60)) / 1000);
    document.getElementById('cd-days').textContent  = String(days).padStart(2,'0');
    document.getElementById('cd-hours').textContent = String(hours).padStart(2,'0');
    document.getElementById('cd-mins').textContent  = String(mins).padStart(2,'0');
    document.getElementById('cd-secs').textContent  = String(secs).padStart(2,'0');
  }

  updateCountdown();
  setInterval(updateCountdown, 1000);
</script>
</body>
</html>
